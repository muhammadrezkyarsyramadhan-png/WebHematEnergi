<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" rx="32" fill="url(#bgGrad)" />

  <!-- Ambient Decorative Circles -->
  <circle cx="120" cy="100" r="140" fill="#34d399" opacity="0.1" />
  <circle cx="700" cy="480" r="180" fill="#facc15" opacity="0.12" />
  <circle cx="680" cy="120" r="70" fill="url(#sunGrad)" opacity="0.85" filter="url(#shadow)" />

  <!-- Floating Sun Rays -->
  <g stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="680" y1="25" x2="680" y2="40" />
    <line x1="680" y1="200" x2="680" y2="215" />
    <line x1="585" y1="120" x2="600" y2="120" />
    <line x1="760" y1="120" x2="775" y2="120" />
    <line x1="615" y1="55" x2="625" y2="65" />
    <line x1="735" y1="175" x2="745" y2="185" />
    <line x1="615" y1="185" x2="625" y2="175" />
    <line x1="735" y1="65" x2="745" y2="55" />
  </g>

  <!-- Big Central Light Bulb (Glass Style) -->
  <g transform="translate(400, 290)">
    <!-- Bulb Glow Outer -->
    <circle cx="0" cy="-60" r="130" fill="#fef08a" opacity="0.15" />
    <circle cx="0" cy="-60" r="95" fill="#fef9c3" opacity="0.25" />

    <!-- Bulb Contour -->
    <path d="M -70 -70 C -70 -115 -35 -145 0 -145 C 35 -145 70 -115 70 -70 C 70 -35 50 -10 40 20 L -40 20 C -50 -10 -70 -35 -70 -70 Z" 
          fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="5" filter="url(#shadow)" />

    <!-- Bulb Filament (Tree / Eco Sprout Inside) -->
    <path d="M 0 15 L 0 -50 M 0 -50 C -25 -65 -30 -95 0 -105 C 30 -95 25 -65 0 -50 Z" 
          fill="url(#leafGrad)" stroke="#10b981" stroke-width="3" />
    <path d="M -15 -45 C -35 -50 -40 -70 -25 -80 C -15 -75 -10 -60 -15 -45 Z" fill="#34d399" opacity="0.9" />
    <path d="M 15 -45 C 35 -50 40 -70 25 -80 C 15 -75 10 -60 15 -45 Z" fill="#34d399" opacity="0.9" />

    <!-- Bulb Screw Base -->
    <rect x="-35" y="22" width="70" height="10" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="-30" y="34" width="60" height="10" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2" />
    <rect x="-24" y="46" width="48" height="10" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
    <path d="M -16 58 C -16 68 16 68 16 58 Z" fill="#475569" />
  </g>

  <!-- Left Card: Energy Efficiency Metric -->
  <g transform="translate(100, 180)" filter="url(#shadow)">
    <rect width="210" height="110" rx="16" fill="url(#cardGrad)" stroke="#bbf7d0" stroke-width="1.5" />
    <circle cx="36" cy="40" r="18" fill="#dcfce7" />
    <text x="36" y="46" font-family="'Poppins', sans-serif" font-size="18" text-anchor="middle" fill="#15803d">⚡</text>
    <text x="66" y="36" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#047857">Rata-rata Skor</text>
    <text x="66" y="58" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#064e3b">3.36 / 4.00</text>
    <rect x="22" y="76" width="166" height="8" rx="4" fill="#e2e8f0" />
    <rect x="22" y="76" width="140" height="8" rx="4" fill="#10b981" />
    <text x="22" y="98" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748b">Kategori: Sangat Baik (59.4%)</text>
  </g>

  <!-- Right Card: Student Participation Metric -->
  <g transform="translate(500, 360)" filter="url(#shadow)">
    <rect width="200" height="100" rx="16" fill="url(#cardGrad)" stroke="#bbf7d0" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#fef3c7" />
    <text x="36" y="44" font-family="'Poppins', sans-serif" font-size="18" text-anchor="middle" fill="#b45309">👥</text>
    <text x="66" y="34" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#92400e">Partisipasi Siswa</text>
    <text x="66" y="56" font-family="'Poppins', sans-serif" font-size="22" font-weight="800" fill="#064e3b">636 Siswa</text>
    <text x="66" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#15803d">99.4% Total Kelas XI</text>
  </g>

  <!-- Floating Eco Leaves & Energy Elements -->
  <g fill="#34d399" opacity="0.8">
    <path d="M 180 380 Q 200 360 215 385 Q 195 400 180 380 Z" />
    <path d="M 230 420 Q 255 400 270 425 Q 245 445 230 420 Z" fill="#6ee7b7" />
    <path d="M 580 190 Q 600 170 615 195 Q 595 210 580 190 Z" fill="#a7f3d0" />
    <polygon points="340,110 348,124 340,128 346,140 334,126 342,122" fill="#facc15" />
    <polygon points="460,90 468,104 460,108 466,120 454,106 462,102" fill="#fde047" />
  </g>

  <!-- Wind Turbine Silhouettes in bottom background -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.35" fill="none">
    <!-- Turbine 1 -->
    <line x1="280" y1="520" x2="280" y2="440" stroke-width="3" />
    <circle cx="280" cy="440" r="4" fill="#ffffff" />
    <line x1="280" y1="440" x2="260" y2="415" />
    <line x1="280" y1="440" x2="305" y2="430" />
    <line x1="280" y1="440" x2="275" y2="465" />

    <!-- Turbine 2 -->
    <line x1="330" y1="535" x2="330" y2="470" stroke-width="2.5" />
    <circle cx="330" cy="470" r="3" fill="#ffffff" />
    <line x1="330" y1="470" x2="315" y2="450" />
    <line x1="330" y1="470" x2="348" y2="462" />
    <line x1="330" y1="470" x2="328" y2="490" />
  </g>
</svg>

